# คัดลอกเป็น secret.yaml แล้วใส่ค่าจริง (secret.yaml อยู่ใน .gitignore) — หรือสร้างด้วย kubectl/External Secrets แทนก็ได้
#
# APP_KEY: สร้างครั้งเดียวแล้วเก็บไว้ตลอด — docker run --rm <image> artisan key:generate --show
#          เปลี่ยน APP_KEY = รหัสผ่าน SMTP / Turnstile secret ที่บันทึกไว้อ่านไม่ได้ และผู้ใช้ทุกคนหลุดจากระบบ
apiVersion: v1
kind: Secret
metadata:
  name: microcms-secret
type: Opaque
stringData:
  APP_KEY: "base64:CHANGE-ME"
  DB_USERNAME: "microcms"
  DB_PASSWORD: "CHANGE-ME"
  REDIS_PASSWORD: "CHANGE-ME"
