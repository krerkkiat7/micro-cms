; ค่า PHP ของ container (dev/ทดสอบ)
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
date.timezone = Asia/Bangkok
expose_php = Off

; OPcache — validate_timestamps=1 + revalidate_freq=30 = แก้โค้ด PHP แล้วเห็นผลภายใน ~30 วินาที (หรือ docker restart cms_app ทันที)
; ตั้งถี่กว่านี้ (เช่น 2) แล้ว request จะกระตุก 1-2 วินาทีทุกครั้งที่ OPcache เช็กเวลาไฟล์ผ่าน bind mount ของ Windows (ช้า)
; (production ตั้ง validate_timestamps=0 แล้ว reload php-fpm ตอน deploy)
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 30

; realpath cache — ลดการเช็กไฟล์ซ้ำ (bind mount จาก Windows อ่านไฟล์ช้า)
realpath_cache_size = 4096K
realpath_cache_ttl = 600
