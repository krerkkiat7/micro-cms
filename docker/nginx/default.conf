# nginx หน้าเว็บ (http://localhost:8001) → php-fpm ใน service app
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # ไฟล์ที่อัปโหลดผ่านโมดูลจัดการไฟล์ต้องผ่าน PHP (/file/..., /admin/file/...) — ขนาดนี้ต้องไม่น้อยกว่า upload_max_filesize
    client_max_body_size 25M;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # asset ที่ build แล้ว (ชื่อไฟล์มี hash) — cache ได้นาน
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        # Laravel ส่ง header Link (preload asset ของ Vite) ยาวเกิน buffer ค่าเริ่มต้น 4k → 502 "upstream sent too big header"
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
