# nginx ใน production image (ฟังที่ :8080, PHP-FPM ที่ 127.0.0.1:9000 ใน container เดียวกัน)
# ใช้เป็นแบบได้สำหรับติดตั้งบน server เอง — เปลี่ยน listen/server_name/root/fastcgi_pass ให้ตรงเครื่อง
server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # ขนาดอัปโหลดสูงสุด — ต้องมากกว่า upload_max_filesize/post_max_size ของ PHP (โมดูลจัดการไฟล์จำกัดไฟล์ละ 5MB)
    client_max_body_size 25M;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # asset จาก Vite (ชื่อไฟล์มี hash) — cache ได้ยาว
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # favicon.ico / robots.txt ไม่มีไฟล์ static — ระบบสร้างให้ (favicon จากตั้งค่าระบบ, robots.txt ชี้ sitemap)
    location = /favicon.ico { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # fastcgi_params ของ nginx รุ่นใหม่ตั้ง HTTP_HOST = $host (ตัดพอร์ตทิ้ง) → ลิงก์/รูปที่ระบบสร้างผิดเมื่อเปิดด้วยพอร์ตอื่น
        # ส่ง Host เดิมทั้งพอร์ต (ระบบตรวจ Host กับ APP_URL เองอยู่แล้ว — trustHosts)
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        # จำเป็น — Laravel ส่ง header Link (preload asset) ยาวเกินค่าเริ่มต้น 4k → 502 "upstream sent too big header"
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
