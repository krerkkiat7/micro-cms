; PHP-FPM pool ของ production image (เสริม www.conf ของ image php:8.2-fpm ที่ฟังที่ :9000 อยู่แล้ว)
[www]
; ส่ง env ของ container (APP_KEY, DB_*, REDIS_* ...) ให้ PHP — ค่าเริ่มต้นของ FPM ล้าง env ทิ้ง
clear_env = no

; จำนวน worker — ประมาณ (RAM ที่ให้ container − 256MB) / 60MB ต่อ worker; ปรับตามเครื่อง
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; log ของ worker ไปที่ stderr ของ container
catch_workers_output = yes
decorate_workers_output = no

; access log ของ FPM ซ้ำกับของ nginx — ปิด
access.log = /dev/null
